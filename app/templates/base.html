<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant Chords</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ request.url_for('static', path='css/style.css') }}"
    >
</head>

<body>

<header class="border-bottom bg-white">
    <div class="container d-flex justify-content-between align-items-center py-3">
        <a href="/" class="d-flex align-items-center text-decoration-none fw-bold fs-1 text-dark">
    <img
        src="{{ request.url_for('static', path='data/images/logo.png') }}"
        alt="Instant Chords logo"
        style="height:108px;"
        class="me-3"
            > 
        Instant Chords
        </a>

        <nav>
            <a href="/features" class="text-decoration-none text-dark me-3">Features</a>
            <a href="/pricing" class="text-decoration-none text-dark me-3">Pricing</a>
            <a href="/search" class="text-decoration-none text-dark me-3">Search</a>
            <a href="/about" class="text-decoration-none text-dark">About</a>
        </nav>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

</body>
</html>
