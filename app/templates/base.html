<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Instant Chords</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="{{ request.url_for('static', path='css/style.css') }}"
    >
</head>

<body class="bg-light">

<!-- HEADER / NAV -->
<header class="bg-white border-bottom sticky-top">
    <div class="container d-flex justify-content-between align-items-center py-3">

        <!-- LOGO -->
        <a href="/" class="d-flex align-items-center text-decoration-none fw-bold fs-4 text-dark">
            <img
                src="{{ request.url_for('static', path='data/images/logo.png') }}"
                alt="Instant Chords logo"
                style="height:56px;"
                class="me-2"
            >
            Instant Chords
        </a>

        <!-- NAV LINKS -->
        <nav class="d-flex align-items-center gap-3">
            <a href="/features" class="nav-link px-2">Features</a>
            <a href="/pricing" class="nav-link px-2">Pricing</a>
            <a href="/search" class="nav-link px-2">Search</a>
            <a href="/about" class="nav-link px-2">About</a>
        </nav>

    </div>
</header>

<!-- MAIN CONTENT -->
<main class="py-4">
    {% block content %}{% endblock %}
</main>

<!-- BOOTSTRAP JS (optional, but good practice) -->
<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js">
</script>

</body>
</html>
